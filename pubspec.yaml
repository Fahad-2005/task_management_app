name: task_management_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
version: 1.0.0+1

environment:
  sdk: ^3.7.0

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8
  
  # Local Storage Persistent Cache Engine [cite: 40, 53]
  shared_preferences: ^2.5.3

  # REST API Client for Week 4 networking tasks [cite: 80]
  http: ^1.3.0

  # Advanced State Management Framework for Week 6 (Riverpod alternative) [cite: 133]
  flutter_riverpod: ^2.6.1

  # Core Cloud Services & Infrastructure Layer [cite: 100]
  firebase_core: ^3.1.1
  
  # User Registration & Session Security [cite: 101]
  firebase_auth: ^5.1.2
  
  # Live Cloud Storage Document Store [cite: 105]
  cloud_firestore: ^5.1.0
  
  # System Background Signal Handler for Push Notifications (Bonus Task) [cite: 132]
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lints to encourage good coding practices
  flutter_lints: ^5.0.0

# The following section is specific to Flutter packages.
flutter:

  # Ensures that the Material Icons font is included with your application
  uses-material-design: true